        address: https://us-central1-copile.cloudfunctions.net
        path_translation: APPEND_PATH_TO_ADDRESS
      consumes:
        - application/json
      produces:
        - application/json

  /groups/updateWorkerStats:
    post:
      operationId: updateWorkerStats
      summary: "Updates stats for a specific worker in a plan."
      description: "Updates worker statistics like winrate, average percentage, and trade count."
      parameters:
        - in: query
          name: group_id
          type: string
          required: true
        - in: query
          name: plan_id
          type: string
          required: true
        - in: query
          name: worker_id
          type: string
          required: true
        - in: body
          name: stats
          required: true
          schema:
            $ref: '#/definitions/WorkerStats'
      responses:
        200:
          description: "Worker stats updated successfully"
        400:
          description: "Bad request, missing fields"
        404:
          description: "Plan not found"
        500:
          description: "Server error"
      x-google-backend:
        address: https://us-central1-copile.cloudfunctions.net
        path_translation: APPEND_PATH_TO_ADDRESS
      consumes:
        - application/json
      produces:
        - application/json

  /:
    get:
      operationId: getRoot
      responses:
        '200':
          description: Successful response
          schema:
            type: string

definitions:
  PlanDetails:
    type: object
    properties:
      internal_notes:
        type: string
      referral_code:
        type: string
      plan_type:
        type: string
      # Add other properties as required

  UpdateDetails:
    type: object
    properties:
      internal_notes:
        type: string
      # Add other properties as required

  WorkerStats:
    type: object
    properties:
      winrate:
        type: number
      avg_pct:
        type: number
      trade_count:
        type: integer


  NewTradeRequest:
    type: object
    properties:
      traderId:
        type: string
      exchange:
        type: string
      api_key:
        type: string
      api_secret:
        type: string
      api_passphrase:
        type: string

  SubmitTPRequest:
    type: object
    properties:
      traderId:
        type: string
      tradeId:
        type: string
      payload:
        type: object
        properties:
          tp_number:
            type: string
          tp_value:
            type: number
          tp_percentage:
            type: number

  SubmitSLRequest:
    type: object
    properties:
      traderId:
        type: string
      tradeId:
        type: string
      payload:
        type: object
        properties:
          sl_number:
            type: string
          sl_value:
            type: number
          sl_percentage:
            type: number

  CancelOrderRequest:
    type: object
    properties:
      traderId:
        type: string
      tradeId:
        type: string
      type:
        type: string
      order_ID:
        type: string

  CancelAllOrdersRequest:
    type: object
    properties:
      traderId:
        type: string
      tradeId:
        type: string

  BulkOrderRequest:
    type: object
    properties:
      traderId:
        type: string
      exchanges:
        type: array
        items:
          type: string
      plans:
        type: array
        items:
          type: string
      payload:
        type: object
        properties:
          side:
            type: string
          symbol:
            type: string
          leverage:
            type: string
          entry:
            type: number
          take_profits:
            type: array
            items:
              type: object
              properties:
                tp_id:
                  type: string
                tp_number:
                  type: string
                tp_value:
                  type: number
                tp_percentage:
                  type: number
          stop_losses:
            type: array
            items:
              type: object
              properties:
                sl_id:
                  type: string
                sl_number:
                  type: string
                sl_value:
                  type: number
                sl_percentage:
                  type: number

  PartialCloseRequest:
    type: object
    properties:
      userId:
        type: string
      tradeId:
        type: string
      percentage:
        type: number

  ApiResponse:
    type: object
    properties:
      success:
        type: boolean
      message:
        type: string

  UpdateExchangeRequest:
    type: object
    properties:
      exchange:
        type: string
      api_key:
        type: string
      api_secret:
        type: string
      api_passphrase:
        type: string

  AccountResponse:
    type: object
    properties:
      success:
        type: boolean
      existingApis:
        type: object
        additionalProperties:
          type: boolean
      always_exchanges:
        type: boolean
      connected_discord:
        type: boolean
      connected_telegram:
        type: boolean
      trader_name:
        type: string

  AlwaysExchangesRequest:
    type: object
    properties:
      always_exchanges:
        type: boolean

  CancelAllTPsRequest:
    type: object
    properties:
      trades:
        type: array
        items:
          type: object
          properties:
            tradeId:
              type: string

  BulkTradeData:
    type: object
    properties:
      trades:
        type: array
        items:
          $ref: '#/definitions/TradeData'

  ReplaceTPRequest:
    type: object
    properties:
      tradeData:
        type: object

  ReplaceSLRequest:
    type: object
    properties:
      tradeData:
        type: object

  BulkTPRequest:
    type: object
    properties:
      trades:
        type: array
        items:
          type: object
          properties:
            tradeId:
              type: string