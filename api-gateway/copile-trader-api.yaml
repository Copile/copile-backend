  /admintrades/trades/{exchange}:
    get:
      operationId: getAdminTrades
      parameters:
        - in: path
          name: exchange
          required: true
          type: string
        - name: traderId
          in: header
          required: true
          type: string
      responses:
        '200':
          description: Successful response
          schema:
            type: object
            properties:
              success:
                type: boolean
              trades:
                type: array
                items:
                  type: object
              executionTime:
                type: integer
      x-google-backend:
        address: https://europe-west2-copile.cloudfunctions.net
        path_translation: APPEND_PATH_TO_ADDRESS
      consumes:
        - application/json
      produces:
        - application/json
