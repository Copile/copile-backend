  /groups/createPlan:
      post:
        operationId: createPlan
        summary: "Creates a new plan and assigns workers to it."
        description: "Receives a POST request with a body containing the details of a new plan and an array of worker IDs."
        parameters:
          - in: body
            name: planDetails
            required: true
            schema:
              $ref: '#/definitions/PlanDetails'
        responses:
          200:
            description: "Plan created successfully"
          400:
            description: "Bad request, missing fields"
          500:
            description: "Server error"
        x-google-backend:
          address: https://us-central1-copile.cloudfunctions.net
          path_translation: APPEND_PATH_TO_ADDRESS
        consumes:
          - application/json
        produces:
          - application/json

  /groups/updatePlan:
    post:
      operationId: updatePlan
      summary: "Updates an existing plan."
      description: "Updates plan details including workers assignment and plan metadata."
      parameters:
        - in: query
          name: group_id
          type: string
          required: true
        - in: query
          name: plan_id
          type: string
          required: true
        - in: body
          name: updateDetails
          required: true
          schema:
            $ref: '#/definitions/UpdateDetails'
      responses:
        200:
          description: "Plan updated successfully"
        400:
          description: "Bad request, missing fields"
        404:
          description: "Plan not found"
        500:
          description: "Server error"
      x-google-backend:
        address: https://us-central1-copile.cloudfunctions.net
        path_translation: APPEND_PATH_TO_ADDRESS
      consumes:
        - application/json
      produces:
        - application/json

  /groups/getData:
    get:
      operationId: getData
      summary: "Fetches data for a specific group."
      description: "Retrieves plans and workers for a given group."
      parameters:
        - in: query
          name: group_id
          type: string
          required: true
      responses:
        200:
          description: "Data retrieval successful"
        400:
