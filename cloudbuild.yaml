steps:
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        # Install jq
        apt-get update && apt-get install -y jq

        # Load JSON configuration
        config_file="cloud-function-config.json"
        functions_config=$(cat $config_file)

        # Loop through each Cloud Function configuration
        for function_config in $(echo "$functions_config" | jq -c '.[]'); do
          name=$(echo "$function_config" | jq -r '.name')
          runtime=$(echo "$function_config" | jq -r '.runtime')
          memory=$(echo "$function_config" | jq -r '.memory')
          region=$(echo "$function_config" | jq -r '.region')
          entry_point=$(echo "$function_config" | jq -r '.entry_point')

          echo "Deploying function: $name"
          # Deploy Cloud Function with specified settings
          gcloud functions deploy $name \
            --runtime=$runtime \
            --trigger-http \
            --allow-unauthenticated \
            --region=$region \
            --memory=$memory \
            --entry-point=$entry_point \
            --source=cloud-functions/$name
        done

    # Cloud Run Services
    - name: 'gcr.io/cloud-builders/docker'
      args: ['build', '-t', 'solana-indexer:latest', 'cloud-run/solana-indexer']
      id: 'build-solana-indexer'

    - name: 'gcr.io/cloud-builders/docker'
      args: ['tag', 'solana-indexer:latest', 'europe-docker.pkg.dev/copile/eu.gcr.io/solana-indexer:latest']
      id: 'tag-solana-indexer'

    - name: 'gcr.io/cloud-builders/docker'
      args: ['push', 'europe-docker.pkg.dev/copile/eu.gcr.io/solana-indexer:latest']
      id: 'push-solana-indexer'

    - name: 'gcr.io/cloud-builders/gcloud'
      args: ['run', 'deploy', 'solana-indexer', '--image', 'europe-docker.pkg.dev/copile/eu.gcr.io/solana-indexer:latest', '--region', 'europe-west2']
      id: 'deploy-solana-indexer'

    - name: 'gcr.io/cloud-builders/docker'
      args: ['build', '-t', 'solana-executor:latest', 'cloud-run/solana-executor']
      id: 'build-solana-executor'

    - name: 'gcr.io/cloud-builders/docker'
      args: ['tag', 'solana-executor:latest', 'europe-docker.pkg.dev/copile/eu.gcr.io/solana-executor:latest']
      id: 'tag-solana-executor'

    - name: 'gcr.io/cloud-builders/docker'
      args: ['push', 'europe-docker.pkg.dev/copile/eu.gcr.io/solana-executor:latest']
      id: 'push-solana-executor'

    - name: 'gcr.io/cloud-builders/gcloud'
      args: ['run', 'deploy', 'solana-executor', '--image', 'europe-docker.pkg.dev/copile/eu.gcr.io/solana-executor:latest', '--region', 'europe-west2']
      id: 'deploy-solana-executor'
